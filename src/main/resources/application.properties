# Nom affiché dans les journaux et informations de diagnostic Spring.
spring.application.name=saik

# Fichier H2 stocké dans le dossier ./data/ à la racine du projet
spring.datasource.url=jdbc:h2:file:./data/saikdb
# Pilote Java qui permet à Spring de dialoguer avec la base H2.
spring.datasource.driver-class-name=org.h2.Driver
# Identifiants locaux par défaut de la base embarquée.
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crée et met à jour les tables d'après tes classes Java
spring.jpa.hibernate.ddl-auto=update
# Affiche les requêtes SQL générées par Hibernate pendant le développement.
spring.jpa.show-sql=true
# Formate les requêtes affichées pour les rendre plus faciles à lire.
spring.jpa.properties.hibernate.format_sql=true

# La console H2 ne doit pas être exposée par défaut.
spring.h2.console.enabled=false
# Chemin de la console si elle est activée explicitement dans un environnement local.
spring.h2.console.path=/h2-console
