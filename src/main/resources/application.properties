# Nom affiché dans les journaux et informations de diagnostic Spring.
spring.application.name=saik

# Port du serveur
server.port=${SERVER_PORT:81}

# Base H2 en mémoire (données perdues au redémarrage)
spring.datasource.url=jdbc:h2:file:./data/saikdb
# Pilote Java qui permet à Spring de dialoguer avec la base H2.
spring.datasource.driver-class-name=org.h2.Driver
# Identifiants locaux par défaut de la base embarquée.
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crée et met à jour les tables d'après tes classes Java
spring.jpa.hibernate.ddl-auto=update
# Affiche les requêtes SQL générées par Hibernate pendant le développement.
# Désactivé par défaut pour ne pas écrire les requêtes dans les journaux ; SAIK_SHOW_SQL=true en développement.
spring.jpa.show-sql=${SAIK_SHOW_SQL:false}
# Formate les requêtes affichées pour les rendre plus faciles à lire.
spring.jpa.properties.hibernate.format_sql=true

# La console H2 ne doit pas être exposée par défaut.
spring.h2.console.enabled=false
# Chemin de la console si elle est activée explicitement dans un environnement local.
spring.h2.console.path=/h2-console

# --- Sécurité ---
# Le cookie de session n'est pas lisible par JavaScript et n'est pas envoyé depuis un autre site.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Mettre SAIK_COOKIE_SECURE=true dès que l'application est servie en HTTPS.
server.servlet.session.cookie.secure=${SAIK_COOKIE_SECURE:false}

# Blocage temporaire d'un compte après trop d'échecs de connexion.
saik.security.max-login-attempts=${SAIK_MAX_LOGIN_ATTEMPTS:5}
saik.security.lockout-minutes=${SAIK_LOCKOUT_MINUTES:15}

# Premier administrateur : créé (ou promu s'il existe) seulement si l'e-mail est défini.
saik.admin.email=${SAIK_ADMIN_EMAIL:}
saik.admin.password=${SAIK_ADMIN_PASSWORD:}
