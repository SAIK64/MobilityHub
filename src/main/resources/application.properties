spring.application.name=saik

# Fichier H2 stocké dans le dossier ./data/ à la racine du projet
spring.datasource.url=jdbc:h2:file:./data/saikdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crée et met à jour les tables d'après tes classes Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web H2 (accessible sur http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console