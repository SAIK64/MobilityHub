<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Métadonnées et style partagé avec la page de connexion. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription — SAIK</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <!-- Carte qui contient la présentation et le formulaire d’inscription. -->
  <main class="card">
    <p class="brand">SAIK Travel</p>
    <h1>Créer un compte</h1>
    <p>Préparez vos prochains voyages en toute simplicité.</p>
    <!-- Thymeleaf relie les champs au modèle AuthRequest validé côté serveur. -->
    <form method="post" th:action="@{/register}" th:object="${form}">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" th:field="*{email}" autocomplete="email" required autofocus>
      <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" role="alert"></p>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="password-help">
      <small id="password-help">Au moins 8 caractères et au maximum 72 octets.</small>
      <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"></p>
      <button type="submit">Créer mon compte</button>
    </form>
    <p class="foot">Déjà inscrit ? <a href="/login">Se connecter</a></p>
  </main>
</body>
</html>
