<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Métadonnées et style partagé avec la page de connexion. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription — SAIK</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="/css/design.css" th:href="@{/css/design.css}">
  <link rel="stylesheet" href="/css/accueil.css" th:href="@{/css/accueil.css}">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <header th:replace="~{fragments/layout :: publicHeader(false)}"></header>
  <!-- Carte qui contient la présentation et le formulaire d’inscription. -->
  <main class="card">
    <a class="back-link" href="/accueil" th:href="@{/accueil}">← Retour à l’accueil</a>
    <p class="brand">SAIK Travel</p>
    <h1>Créer un compte</h1>
    <p>Préparez vos prochains voyages en toute simplicité.</p>
    <!-- Thymeleaf relie les champs au modèle AuthRequest validé côté serveur. -->
    <form method="post" th:action="@{/register}" th:object="${form}">
      <label for="firstName">Prénom</label>
      <input id="firstName" type="text" th:field="*{firstName}" autocomplete="given-name" maxlength="100" required autofocus>
      <p class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" role="alert"></p>
      <label for="lastName">Nom</label>
      <input id="lastName" type="text" th:field="*{lastName}" autocomplete="family-name" maxlength="100" required>
      <p class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" role="alert"></p>
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" th:field="*{email}" autocomplete="email" required>
      <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" role="alert"></p>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="password-help">
      <small id="password-help">Au moins 8 caractères et au maximum 72 octets.</small>
      <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"></p>
      <button type="submit">Créer mon compte</button>
    </form>
    <p class="foot">Déjà inscrit ? <a href="/login">Se connecter</a></p>
  </main>
</body>
</html>
